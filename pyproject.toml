[project]
name = "deepvoice"
version = "0.1.0"
description = "DeepVoice: what do fake-voice detectors learn, and what survives a data change? (CMPS 261)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "joblib",
    "librosa",
    "soundfile",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
# GPU / deep-learning stack: install on the compute machine with `uv sync --extra dl`
dl = ["torch", "torchaudio", "transformers", "accelerate", "peft", "optuna"]

[dependency-groups]
dev = ["pytest", "ruff", "nbstripout", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepvoice"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
